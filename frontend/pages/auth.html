<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Recognition Login</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Assistive Learning Network</h1>
            <p class="subtitle">
                Emotion Recognition for Learning Support
            </p>

        
            <form id="loginForm">

                <h2>Login</h2>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p>
                    Don't have an account?
                    <span id="showSignup">
                        Sign Up
                    </span>
                </p>

            </form>

            
            <form id="signupForm" class="hidden">

                <h2>Create Account</h2>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="number"
                    id="signupAge"
                    placeholder="Age"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

                <p>
                    Already have an account?
                    <span id="showLogin">
                        Login
                    </span>
                </p>

            </form>

            <div id="message"></div>

        </div>

    </div>

    <script src="../js/auth.js"></script>

</body>
</html>
